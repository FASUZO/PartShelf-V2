<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试参数显示 - 调试版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>测试参数显示 - 调试版</h1>
        
        <div class="mb-3">
            <label for="partId" class="form-label">零件ID</label>
            <input type="number" class="form-control" id="partId" value="157">
            <button class="btn btn-primary mt-2" onclick="testLoadPart()">加载零件</button>
        </div>
        
        <div class="card mb-3" id="detailParamsCard" style="display: none;">
            <div class="card-header bg-light"><strong>器件参数</strong></div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-sm table-bordered mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>参数名</th>
                                <th>参数值</th>
                            </tr>
                        </thead>
                        <tbody id="detailParamsBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div id="debugInfo" class="mt-3">
            <h3>调试信息</h3>
            <pre id="debugOutput" class="bg-dark text-light p-3 rounded"></pre>
        </div>
    </div>

    <script src="../static/js/inventory/utils.js"></script>
    <script src="../static/js/inventory/config-loader.js"></script>
    <script src="../static/js/inventory/table.js"></script>
    <script>
        // 测试加载零件
        async function testLoadPart() {
            const partId = document.getElementById('partId').value;
            const debugOutput = document.getElementById('debugOutput');
            
            debugOutput.textContent = '=== 开始测试 ===\n\n';
            
            try {
                // 1. 测试API
                debugOutput.textContent += '1. 调用API...\n';
                const response = await fetch(`/api/inventory/get_part_by_id?part_id=${partId}`);
                if (!response.ok) throw new Error('加载失败');
                
                const data = await response.json();
                debugOutput.textContent += `   API返回成功\n`;
                debugOutput.textContent += `   data.other: ${data.other}\n\n`;
                
                // 2. 测试 parsePartParams
                debugOutput.textContent += '2. 调用 parsePartParams...\n';
                if (typeof parsePartParams === 'function') {
                    debugOutput.textContent += '   parsePartParams 函数存在\n';
                    const params = parsePartParams(data.other);
                    debugOutput.textContent += `   返回值: ${JSON.stringify(params, null, 2)}\n\n`;
                    
                    // 3. 测试 populateParamsTable
                    debugOutput.textContent += '3. 调用 populateParamsTable...\n';
                    if (typeof populateParamsTable === 'function') {
                        debugOutput.textContent += '   populateParamsTable 函数存在\n';
                        populateParamsTable(params, data.category_id, data.subcategory_id);
                        debugOutput.textContent += '   函数调用完成\n\n';
                    } else {
                        debugOutput.textContent += '   错误: populateParamsTable 函数不存在\n\n';
                    }
                } else {
                    debugOutput.textContent += '   错误: parsePartParams 函数不存在\n\n';
                }
                
                // 4. 检查DOM元素
                debugOutput.textContent += '4. 检查DOM元素...\n';
                const tbody = document.getElementById('detailParamsBody');
                const card = document.getElementById('detailParamsCard');
                debugOutput.textContent += `   tbody 存在: ${!!tbody}\n`;
                debugOutput.textContent += `   card 存在: ${!!card}\n`;
                debugOutput.textContent += `   card 显示: ${card.style.display}\n`;
                debugOutput.textContent += `   tbody 内容: ${tbody.innerHTML.substring(0, 100)}...\n`;
                
            } catch (error) {
                debugOutput.textContent += `\n错误: ${error.message}\n`;
                console.error('Error:', error);
            }
        }

        // 页面加载时自动测试
        window.onload = function() {
            testLoadPart();
        };
    </script>
</body>
</html>
