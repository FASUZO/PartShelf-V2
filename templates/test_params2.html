<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试参数显示</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>测试参数显示</h1>
        
        <div class="mb-3">
            <label for="partId" class="form-label">零件ID</label>
            <input type="number" class="form-control" id="partId" value="157">
            <button class="btn btn-primary mt-2" onclick="testLoadPart()">加载零件</button>
        </div>
        
        <div class="card mb-3" id="detailParamsCard" style="display: none;">
            <div class="card-header bg-light"><strong>器件参数</strong></div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-sm table-bordered mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>参数名</th>
                                <th>参数值</th>
                            </tr>
                        </thead>
                        <tbody id="detailParamsBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div id="debugInfo" class="mt-3">
            <h3>调试信息</h3>
            <pre id="debugOutput"></pre>
        </div>
    </div>

    <script src="../static/js/inventory/utils.js"></script>
    <script src="../static/js/inventory/config-loader.js"></script>
    <script src="../static/js/inventory/table.js"></script>
    <script>
        // 测试加载零件
        async function testLoadPart() {
            const partId = document.getElementById('partId').value;
            const debugOutput = document.getElementById('debugOutput');
            
            debugOutput.textContent = '加载中...\n';
            
            try {
                const response = await fetch(`/api/inventory/get_part_by_id?part_id=${partId}`);
                if (!response.ok) throw new Error('加载失败');
                
                const data = await response.json();
                debugOutput.textContent += 'API 返回数据:\n';
                debugOutput.textContent += JSON.stringify(data, null, 2) + '\n\n';
                
                debugOutput.textContent += 'data.other 字段:\n';
                debugOutput.textContent += data.other + '\n\n';
                
                // 调用 parsePartParams
                debugOutput.textContent += '调用 parsePartParams:\n';
                const params = parsePartParams(data.other);
                debugOutput.textContent += JSON.stringify(params, null, 2) + '\n\n';
                
                // 调用 populateParamsTable
                debugOutput.textContent += '调用 populateParamsTable:\n';
                populateParamsTable(params, data.category_id, data.subcategory_id);
                
                debugOutput.textContent += '参数表格已更新\n';
            } catch (error) {
                debugOutput.textContent += '错误: ' + error.message + '\n';
                console.error('Error:', error);
            }
        }

        // 页面加载时自动测试
        window.onload = function() {
            testLoadPart();
        };
    </script>
</body>
</html>
