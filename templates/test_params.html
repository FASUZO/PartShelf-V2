<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试参数显示</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>测试参数显示</h1>
        
        <div class="mb-3">
            <label for="partId" class="form-label">零件ID</label>
            <input type="number" class="form-control" id="partId" value="157">
            <button class="btn btn-primary mt-2" onclick="testLoadPart()">加载零件</button>
        </div>
        
        <div class="card mb-3" id="detailParamsCard" style="display: none;">
            <div class="card-header bg-light"><strong>器件参数</strong></div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-sm table-bordered mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>参数名</th>
                                <th>参数值</th>
                            </tr>
                        </thead>
                        <tbody id="detailParamsBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div id="debugInfo" class="mt-3">
            <h3>调试信息</h3>
            <pre id="debugOutput"></pre>
        </div>
    </div>

    <script src="../static/js/inventory/utils.js"></script>
    <script src="../static/js/inventory/config-loader.js"></script>
    <script>
        // 复制 parsePartParams 函数
        function parsePartParams(otherJson) {
            if (!otherJson) return null;
            try {
                const data = JSON.parse(otherJson);
                if (typeof data === 'object' && data !== null && !Array.isArray(data)) {
                    // 检查是否是新格式（包含fields、values、units）
                    if (data.fields && data.values) {
                        return {
                            values: data.values,
                            units: data.units || {},
                            isNewFormat: true
                        };
                    }
                    // 旧格式（直接是键值对）
                    return {
                        values: data,
                        units: {},
                        isNewFormat: false
                    };
                }
                return null;
            } catch (e) {
                console.error('解析参数失败:', e);
                return null;
            }
        }

        // 复制 populateParamsTable 函数
        function populateParamsTable(params, catId, subcatId) {
            const tbody = document.getElementById('detailParamsBody');
            const card = document.getElementById('detailParamsCard');

            console.log('populateParamsTable - params:', params);
            console.log('populateParamsTable - tbody:', tbody);
            console.log('populateParamsTable - card:', card);

            if (!params || !params.values || Object.keys(params.values).length === 0) {
                console.log('populateParamsTable - hiding card, no params');
                card.style.display = 'none';
                return;
            }

            card.style.display = 'block';
            tbody.innerHTML = '';

            // 获取单位信息
            let units = params.units || {};

            for (const [key, value] of Object.entries(params.values)) {
                const unit = units[key] || '';
                const unitHtml = unit ? ' <span class="badge bg-secondary">' + escapeHtml(unit) + '</span>' : '';
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${escapeHtml(key)}</strong></td>
                    <td>${escapeHtml(String(value))}${unitHtml}</td>
                `;
                tbody.appendChild(row);
            }
        }

        // 测试加载零件
        async function testLoadPart() {
            const partId = document.getElementById('partId').value;
            const debugOutput = document.getElementById('debugOutput');
            
            debugOutput.textContent = '加载中...\n';
            
            try {
                const response = await fetch(`/api/inventory/get_part_by_id?part_id=${partId}`);
                if (!response.ok) throw new Error('加载失败');
                
                const data = await response.json();
                debugOutput.textContent += 'API 返回数据:\n';
                debugOutput.textContent += JSON.stringify(data, null, 2) + '\n\n';
                
                debugOutput.textContent += 'data.other 字段:\n';
                debugOutput.textContent += data.other + '\n\n';
                
                const params = parsePartParams(data.other);
                debugOutput.textContent += '解析后的参数:\n';
                debugOutput.textContent += JSON.stringify(params, null, 2) + '\n\n';
                
                populateParamsTable(params, data.category_id, data.subcategory_id);
                
                debugOutput.textContent += '参数表格已更新\n';
            } catch (error) {
                debugOutput.textContent += '错误: ' + error.message + '\n';
            }
        }

        // 页面加载时自动测试
        window.onload = function() {
            testLoadPart();
        };
    </script>
</body>
</html>
