<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LC查询 - PartShelf</title>
    <link href="/static/css/bootstrap.css" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">
    <script src="/static/js/bootstrap.bundle.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
      body { background: #f0f2f5; }
      .search-box { max-width: 600px; margin: 2rem auto; }
      .result-card { max-width: 900px; margin: 0 auto; }
      .param-item { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #eee; }
      .param-item:last-child { border-bottom: none; }
      .param-label { color: #666; font-size: 0.9rem; min-width: 120px; }
      .param-value { font-weight: 500; text-align: right; word-break: break-all; }
      .stock-badge { padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem; }
      .stock-now { background: #d4edda; color: #155724; }
      .stock-future { background: #fff3cd; color: #856404; }
      .stock-none { background: #f8d7da; color: #721c24; }
      .cookie-status { position: fixed; top: 70px; right: 20px; z-index: 1000; }
      .compare-table { font-size: 0.85rem; }
      .compare-table td { padding: 0.4rem 0.6rem; vertical-align: top; }
      .compare-table .diff { background: #fff3cd; }
      .compare-table .missing { background: #f8d7da; }
      .param-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
      @media (max-width: 768px) { .param-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    {% set active_page = "lcsc" %}
    {% include "_navbar.html" %}

    <div class="container" style="margin-top:70px;">
      <!-- Cookie状态 -->
      <div class="cookie-status">
        <div id="cookieStatusBadge" class="badge bg-secondary" style="cursor:pointer;" onclick="showCookieModal()">
          <i class="fas fa-cookie-bite me-1"></i> Cookie检查中...
        </div>
      </div>

      <!-- 搜索区域 -->
      <div class="search-box">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title mb-3"><i class="fas fa-search-plus me-2"></i>LC编号查询</h5>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-barcode"></i></span>
              <input type="text" class="form-control form-control-lg" id="lcCodeInput"
                     placeholder="输入LC编号，如 C192666" autofocus>
              <button class="btn btn-primary btn-lg" type="button" id="searchBtn" onclick="searchLcCode()">
                <i class="fas fa-search me-1"></i> 查询
              </button>
            </div>
            <div class="form-text mt-2">输入立创商城的LC编号（以C开头，后跟数字）</div>
          </div>
        </div>
      </div>

      <!-- 查询结果 -->
      <div id="resultArea" style="display:none;">
        <div class="result-card">
          <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
              <h5 class="mb-0"><i class="fas fa-microchip me-2"></i>零件信息</h5>
              <span class="badge bg-light text-primary" id="resultLcCode"></span>
            </div>
            <div class="card-body">
              <div class="row">
                <!-- 基本信息 -->
                <div class="col-md-6">
                  <h6 class="text-muted mb-3">基本信息</h6>
                  <div class="param-item">
                    <span class="param-label">LC编号</span>
                    <span class="param-value" id="paramLcCode">-</span>
                  </div>
                  <div class="param-item">
                    <span class="param-label">型号</span>
                    <span class="param-value" id="paramModel">-</span>
                  </div>
                  <div class="param-item">
                    <span class="param-label">品牌</span>
                    <span class="param-value" id="paramBrand">-</span>
                  </div>
                  <div class="param-item">
                    <span class="param-label">封装</span>
                    <span class="param-value" id="paramPackage">-</span>
                  </div>
                  <div class="param-item">
                    <span class="param-label">库存状态</span>
                    <span class="param-value" id="paramStock">-</span>
                  </div>
                </div>

                <!-- 价格和参数 -->
                <div class="col-md-6">
                  <h6 class="text-muted mb-3">价格信息</h6>
                  <div class="param-item">
                    <span class="param-label">单价</span>
                    <span class="param-value" id="paramPrice">-</span>
                  </div>
                  <div class="param-item">
                    <span class="param-label">库存数量</span>
                    <span class="param-value" id="paramQuantity">-</span>
                  </div>
                  <div class="param-item">
                    <span class="param-label">最小起订量</span>
                    <span class="param-value" id="paramMoq">-</span>
                  </div>
                </div>
              </div>

              <!-- 描述 -->
              <div class="mt-3" id="descArea" style="display:none;">
                <h6 class="text-muted mb-2">描述</h6>
                <p class="text-muted small" id="paramDesc"></p>
              </div>

              <!-- 参数详情 -->
              <div class="mt-3" id="paramsArea" style="display:none;">
                <h6 class="text-muted mb-2">详细参数</h6>
                <div class="param-grid" id="paramDetails"></div>
              </div>

              <!-- 操作按钮 -->
              <div class="mt-4 d-flex gap-2 flex-wrap">
                <button class="btn btn-success flex-fill" onclick="stockInFromLcsc()">
                  <i class="fas fa-arrow-down me-1"></i> 入库
                </button>
                <button class="btn btn-outline-info" onclick="compareWithInventory()">
                  <i class="fas fa-exchange-alt me-1"></i> 对比库存
                </button>
                <button class="btn btn-outline-primary" onclick="openLcscPage()">
                  <i class="fas fa-external-link-alt me-1"></i> 立创页面
                </button>
                <button class="btn btn-outline-secondary" onclick="copyLcCode()">
                  <i class="fas fa-copy me-1"></i> 复制编号
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 对比结果 -->
      <div id="compareArea" style="display:none;">
        <div class="result-card mt-3">
          <div class="card">
            <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
              <h5 class="mb-0"><i class="fas fa-exchange-alt me-2"></i>库存对比</h5>
              <button class="btn btn-sm btn-light" onclick="document.getElementById('compareArea').style.display='none'">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <div class="card-body" id="compareContent"></div>
          </div>
        </div>
      </div>

      <!-- 查询历史 -->
      <div class="mt-4" style="max-width:900px; margin:0 auto;">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="fas fa-history me-2"></i>查询历史</span>
            <button class="btn btn-sm btn-outline-danger" onclick="clearHistory()">清空</button>
          </div>
          <div class="card-body" id="historyList">
            <p class="text-muted text-center mb-0">暂无查询记录</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Cookie管理模态框 -->
    <div class="modal fade" id="cookieModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-dark text-white">
            <h5 class="modal-title"><i class="fas fa-cookie-bite me-1"></i> Cookie管理</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="cookieInfo" class="mb-3"></div>
            <div class="alert alert-info small">
              <i class="fas fa-info-circle me-1"></i>
              Cookie用于查询立创商城数据。过期后需要重新获取。
            </div>
            <div class="d-grid gap-2">
              <button class="btn btn-primary" onclick="refreshCookie()">
                <i class="fas fa-sync-alt me-1"></i> 刷新Cookie
              </button>
              <button class="btn btn-outline-secondary" onclick="showQrLogin()">
                <i class="fas fa-qrcode me-1"></i> 二维码登录获取
              </button>
            </div>
            <div id="qrArea" class="mt-3 text-center" style="display:none;">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <p class="mt-2 text-muted">正在获取登录二维码...</p>
              <div id="qrImage"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 入库确认模态框 -->
    <div class="modal fade" id="stockInModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title"><i class="fas fa-arrow-down me-1"></i> 确认入库</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">零件信息</label>
              <div class="form-control-plaintext fw-bold" id="stockInPartInfo">-</div>
            </div>
            <div class="mb-3">
              <label for="stockInQuantity" class="form-label">入库数量 *</label>
              <input type="number" class="form-control" id="stockInQuantity" min="1" value="1" required>
            </div>
            <div class="mb-3">
              <label for="stockInRemark" class="form-label">备注</label>
              <input type="text" class="form-control" id="stockInRemark" value="LC查询入库">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="button" class="btn btn-success" onclick="confirmStockIn()">确认入库</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 对比入库模态框 -->
    <div class="modal fade" id="compareStockInModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header bg-info text-white">
            <h5 class="modal-title"><i class="fas fa-exchange-alt me-1"></i> 更新库存零件参数</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="compareStockInBody"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="button" class="btn btn-success" onclick="saveComparedPart()">保存更新</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      let currentLcData = null;
      let queryHistory = JSON.parse(localStorage.getItem('lcscHistory') || '[]');

      // 页面加载
      checkCookieStatus();
      renderHistory();

      document.getElementById('lcCodeInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') searchLcCode();
      });

      // Cookie状态检查
      async function checkCookieStatus() {
        const badge = document.getElementById('cookieStatusBadge');
        try {
          const resp = await fetch('/api/lcsc/cookies');
          const data = await resp.json();
          if (data.status === 'ok') {
            badge.className = 'badge bg-success';
            badge.innerHTML = '<i class="fas fa-cookie-bite me-1"></i> Cookie正常';
          } else {
            badge.className = 'badge bg-warning text-dark';
            badge.innerHTML = '<i class="fas fa-exclamation-triangle me-1"></i> Cookie异常';
          }
        } catch (e) {
          badge.className = 'badge bg-danger';
          badge.innerHTML = '<i class="fas fa-times-circle me-1"></i> Cookie检查失败';
        }
      }

      // Cookie管理模态框
      function showCookieModal() {
        checkCookieStatus();
        new bootstrap.Modal(document.getElementById('cookieModal')).show();
      }

      // 刷新Cookie
      async function refreshCookie() {
        const info = document.getElementById('cookieInfo');
        info.innerHTML = '<div class="alert alert-info"><i class="fas fa-spinner fa-spin me-1"></i> 正在刷新Cookie...</div>';
        try {
          const resp = await fetch('/api/lcsc/cookies/refresh', { method: 'POST' });
          const data = await resp.json();
          if (data.success) {
            info.innerHTML = '<div class="alert alert-success"><i class="fas fa-check me-1"></i> Cookie刷新成功</div>';
            checkCookieStatus();
          } else {
            info.innerHTML = `<div class="alert alert-danger"><i class="fas fa-times me-1"></i> ${data.message || '刷新失败'}</div>`;
          }
        } catch (e) {
          info.innerHTML = `<div class="alert alert-danger"><i class="fas fa-times me-1"></i> ${e.message}</div>`;
        }
      }

      // 二维码登录
      async function showQrLogin() {
        const qrArea = document.getElementById('qrArea');
        const qrImage = document.getElementById('qrImage');
        qrArea.style.display = 'block';
        qrImage.innerHTML = '<div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">正在获取登录二维码...</p>';

        try {
          const resp = await fetch('/api/lcsc/cookies/qrcode', { method: 'POST' });
          const data = await resp.json();
          if (data.success && data.qrcode_url) {
            qrImage.innerHTML = `
              <img src="${data.qrcode_url}" alt="登录二维码" style="max-width:250px; border:1px solid #ddd; padding:10px; border-radius:8px;">
              <p class="mt-2 small text-muted">请使用立创商城APP扫描二维码登录</p>
            `;
            // 轮询检查登录状态
            pollLoginStatus();
          } else {
            qrImage.innerHTML = `<p class="text-danger">${data.message || '获取二维码失败'}</p>`;
          }
        } catch (e) {
          qrImage.innerHTML = `<p class="text-danger">${e.message}</p>`;
        }
      }

      // 轮询登录状态
      async function pollLoginStatus() {
        for (let i = 0; i < 60; i++) {
          await new Promise(r => setTimeout(r, 2000));
          try {
            const resp = await fetch('/api/lcsc/cookies/status');
            const data = await resp.json();
            if (data.logged_in) {
              document.getElementById('qrImage').innerHTML = '<div class="alert alert-success"><i class="fas fa-check-circle me-1"></i> 登录成功！Cookie已更新</div>';
              checkCookieStatus();
              return;
            }
          } catch (e) {}
        }
        document.getElementById('qrImage').innerHTML = '<div class="alert alert-warning"><i class="fas fa-clock me-1"></i> 二维码已过期，请重新获取</div>';
      }

      // 查询LC编号
      async function searchLcCode() {
        const input = document.getElementById('lcCodeInput');
        let lcCode = input.value.trim().toUpperCase();

        if (!lcCode) { showToast('请输入LC编号', 'warning'); input.focus(); return; }

        if (/^\d+$/.test(lcCode)) { lcCode = 'C' + lcCode; input.value = lcCode; }
        if (!/^C\d+$/.test(lcCode)) { showToast('LC编号格式错误，应为C+数字', 'danger'); return; }

        const btn = document.getElementById('searchBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> 查询中...';

        try {
          const resp = await fetch(`/api/lcsc/query/${lcCode}`);
          if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.detail || '查询失败');
          }
          const data = await resp.json();
          currentLcData = data;
          displayResult(data);
          addToHistory(lcCode, data);
        } catch (e) {
          showToast('查询失败: ' + e.message, 'danger');
          document.getElementById('resultArea').style.display = 'none';
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-search me-1"></i> 查询';
        }
      }

      // 显示查询结果
      function displayResult(data) {
        document.getElementById('resultArea').style.display = 'block';
        document.getElementById('resultLcCode').textContent = data.lcCode || '-';
        document.getElementById('paramLcCode').textContent = data.lcCode || '-';
        document.getElementById('paramModel').textContent = data.productModel || '-';
        document.getElementById('paramBrand').textContent = data.brand || '-';
        document.getElementById('paramPackage').textContent = data.pack || data.package || '-';
        document.getElementById('paramPrice').textContent = data.price ? `¥${data.price}` : '-';
        document.getElementById('paramQuantity').textContent = data.stock ?? '-';
        document.getElementById('paramMoq').textContent = data.moq ?? '-';

        const stockEl = document.getElementById('paramStock');
        if (data.stockStatus === 'now') {
          stockEl.innerHTML = '<span class="stock-badge stock-now">现货</span>';
        } else if (data.stockStatus === 'future') {
          stockEl.innerHTML = '<span class="stock-badge stock-future">期货</span>';
        } else {
          stockEl.innerHTML = '<span class="stock-badge stock-none">未知</span>';
        }

        if (data.description) {
          document.getElementById('descArea').style.display = 'block';
          document.getElementById('paramDesc').textContent = data.description;
        } else {
          document.getElementById('descArea').style.display = 'none';
        }

        // 详细参数 - 优先使用params，其次remarkPrefix
        const params = parseParams(data.params) || parseRemarkPrefix(data.remarkPrefix);
        if (params && Object.keys(params).length > 0) {
          document.getElementById('paramsArea').style.display = 'block';
          let html = '';
          for (const [key, val] of Object.entries(params)) {
            html += `<div class="param-item"><span class="param-label">${escapeHtml(key)}</span><span class="param-value">${escapeHtml(String(val))}</span></div>`;
          }
          document.getElementById('paramDetails').innerHTML = html;
        } else {
          document.getElementById('paramsArea').style.display = 'none';
        }
      }

      // 解析params字段（格式：X1：Y1; X2：Y2;）
      function parseParams(params) {
        if (!params) return null;
        if (typeof params === 'object' && !Array.isArray(params)) return params;
        if (typeof params === 'string') {
          try { return JSON.parse(params); } catch (e) {}
          // 解析分号分隔的key：value格式
          const result = {};
          const lines = params.split(';');
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed) continue;
            const match = trimmed.match(/^(.+?)[：:]\s*(.+)$/);
            if (match) {
              const key = match[1].trim();
              const val = match[2].trim();
              if (key && val && val !== '-') {
                result[key] = val;
              }
            }
          }
          return Object.keys(result).length > 0 ? result : null;
        }
        return null;
      }

      // 解析remarkPrefix字段（格式：key：value</br>key：value）
      function parseRemarkPrefix(remarkPrefix) {
        if (!remarkPrefix || typeof remarkPrefix !== 'string') return null;
        const params = {};
        const lines = remarkPrefix.split(/<\/br>|\n/);
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;
          // 支持中文冒号和英文冒号
          const match = trimmed.match(/^(.+?)[：:]\s*(.+)$/);
          if (match) {
            const key = match[1].trim();
            const val = match[2].trim();
            if (key && val && val !== '-') {
              params[key] = val;
            }
          }
        }
        return Object.keys(params).length > 0 ? params : null;
      }

      // 对比库存
      async function compareWithInventory() {
        if (!currentLcData) return;
        const lcCode = currentLcData.lcCode;
        if (!lcCode) { showToast('无LC编号可对比', 'warning'); return; }

        try {
          const resp = await fetch(`/api/inventory/advanced_search`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ search_key: lcCode, page: 1, page_size: 10 })
          });
          const data = await resp.json();
          const parts = data.data || [];

          if (parts.length === 0) {
            showToast('库存中未找到匹配零件', 'info');
            return;
          }

          displayCompareResult(parts[0]);
        } catch (e) {
          showToast('查询库存失败: ' + e.message, 'danger');
        }
      }

      // 显示对比结果
      function displayCompareResult(part) {
        const area = document.getElementById('compareArea');
        const content = document.getElementById('compareContent');
        area.style.display = 'block';

        const lcscParams = parseParams(currentLcData.params) || parseRemarkPrefix(currentLcData.remarkPrefix) || {};
        const partParams = parseParams(part.other) || {};

        let html = `
          <div class="table-responsive">
            <table class="table table-bordered compare-table mb-0">
              <thead class="table-light">
                <tr><th style="width:25%">字段</th><th style="width:37%">LCSC数据</th><th style="width:37%">库存数据</th></tr>
              </thead>
              <tbody>
                <tr><td>型号</td><td>${escapeHtml(currentLcData.productModel)}</td><td>${escapeHtml(part.name)}</td></tr>
                <tr><td>品牌</td><td>${escapeHtml(currentLcData.brand)}</td><td>${escapeHtml(part.manufacturer)}</td></tr>
                <tr><td>封装</td><td>${escapeHtml((currentLcData.pack || currentLcData.package))}</td><td>${escapeHtml(part.package)}</td></tr>
                <tr><td>LC编号</td><td>${escapeHtml(currentLcData.lcCode)}</td><td>${escapeHtml(part.lc_number || '-')}</td></tr>
                <tr><td>描述</td><td>${escapeHtml(currentLcData.description || '-')}</td><td>${escapeHtml(part.description || '-')}</td></tr>
              </tbody>
            </table>
          </div>
        `;

        // 参数对比
        const allKeys = new Set([...Object.keys(lcscParams), ...Object.keys(partParams)]);
        if (allKeys.size > 0) {
          html += '<h6 class="mt-3 mb-2 text-muted">参数对比</h6>';
          html += '<div class="table-responsive"><table class="table table-bordered compare-table mb-0"><thead class="table-light"><tr><th>参数</th><th>LCSC</th><th>库存</th></tr></thead><tbody>';
          for (const key of allKeys) {
            const lcscVal = lcscParams[key] || '-';
            const partVal = partParams[key] || '-';
            const cls = (!partParams[key] && lcscParams[key]) ? ' class="missing"' : (lcscVal !== partVal ? ' class="diff"' : '');
            html += `<tr${cls}><td>${escapeHtml(key)}</td><td>${escapeHtml(String(lcscVal))}</td><td>${escapeHtml(String(partVal))}</td></tr>`;
          }
          html += '</tbody></table></div>';
        }

        // 更新按钮
        html += `<div class="mt-3 d-flex gap-2">
          <button class="btn btn-warning flex-fill" onclick="updatePartFromLcsc(${part.id})">
            <i class="fas fa-sync me-1"></i> 用LCSC数据更新库存零件
          </button>
        </div>`;

        content.innerHTML = html;
      }

      // 用LCSC数据更新库存零件
      async function updatePartFromLcsc(partId) {
        if (!currentLcData) return;
        if (!confirm('确定用LCSC数据更新库存零件的参数？')) return;

        const lcscParams = parseParams(currentLcData.params) || parseRemarkPrefix(currentLcData.remarkPrefix) || {};
        const formData = new FormData();
        formData.append('part_id', partId);
        formData.append('name', currentLcData.productModel || '');
        formData.append('manufacturer', currentLcData.brand || '');
        formData.append('package', (currentLcData.pack || currentLcData.package) || '');
        formData.append('lc_number', currentLcData.lcCode || '');
        formData.append('description', currentLcData.description || '');

        // 合并参数
        if (Object.keys(lcscParams).length > 0) {
          formData.append('other', JSON.stringify({
            fields: Object.keys(lcscParams),
            values: lcscParams,
            units: {}
          }));
        }

        try {
          const resp = await fetch('/api/inventory/update_part', {
            method: 'POST',
            body: formData
          });
          if (!resp.ok) throw new Error('更新失败');
          showToast('零件参数已更新！', 'success');
          document.getElementById('compareArea').style.display = 'none';
        } catch (e) {
          showToast('更新失败: ' + e.message, 'danger');
        }
      }

      // 入库
      function stockInFromLcsc() {
        if (!currentLcData) return;
        document.getElementById('stockInPartInfo').textContent = `${currentLcData.productModel || '-'} (${currentLcData.brand || '-'})`;
        document.getElementById('stockInQuantity').value = 1;
        new bootstrap.Modal(document.getElementById('stockInModal')).show();
      }

      async function confirmStockIn() {
        const quantity = parseInt(document.getElementById('stockInQuantity').value);
        if (!quantity || quantity < 1) { showToast('请输入有效数量', 'warning'); return; }

        const lcscParams = parseParams(currentLcData.params) || parseRemarkPrefix(currentLcData.remarkPrefix) || {};
        const formData = new FormData();
        formData.append('name', currentLcData.productModel || '');
        formData.append('manufacturer', currentLcData.brand || '');
        formData.append('package', (currentLcData.pack || currentLcData.package) || '');
        formData.append('quantity', quantity);
        formData.append('lc_number', currentLcData.lcCode || '');
        formData.append('description', currentLcData.description || '');
        formData.append('part_type', '');
        if (Object.keys(lcscParams).length > 0) {
          formData.append('other', JSON.stringify({
            fields: Object.keys(lcscParams),
            values: lcscParams,
            units: {}
          }));
        }

        try {
          const resp = await fetch('/api/inventory/add_part_to_inventory', { method: 'POST', body: formData });
          if (!resp.ok) { const err = await resp.json().catch(() => ({})); throw new Error(err.detail || '入库失败'); }
          bootstrap.Modal.getInstance(document.getElementById('stockInModal')).hide();
          showToast('入库成功！', 'success');
        } catch (e) { showToast('入库失败: ' + e.message, 'danger'); }
      }

      function openLcscPage() {
        if (currentLcData?.lcCode) window.open(`https://www.szlcsc.com/product/details_${currentLcData.lcCode}.html`, '_blank');
      }

      function copyLcCode() {
        if (currentLcData?.lcCode) {
          navigator.clipboard.writeText(currentLcData.lcCode);
          showToast('已复制: ' + currentLcData.lcCode, 'success');
        }
      }

      function addToHistory(lcCode, data) {
        queryHistory = queryHistory.filter(h => h.code !== lcCode);
        queryHistory.unshift({ code: lcCode, model: data.productModel, time: Date.now() });
        if (queryHistory.length > 20) queryHistory.pop();
        localStorage.setItem('lcscHistory', JSON.stringify(queryHistory));
        renderHistory();
      }

      function renderHistory() {
        const el = document.getElementById('historyList');
        if (queryHistory.length === 0) {
          el.innerHTML = '<p class="text-muted text-center mb-0">暂无查询记录</p>';
          return;
        }
        el.innerHTML = queryHistory.map(h => `
          <div class="d-flex justify-content-between align-items-center py-2 border-bottom" style="cursor:pointer;" onclick="quickSearch('${h.code}')">
            <div>
              <strong>${escapeHtml(h.code)}</strong>
              <span class="text-muted ms-2">${escapeHtml(h.model || '-')}</span>
            </div>
            <small class="text-muted">${new Date(h.time).toLocaleString()}</small>
          </div>
        `).join('');
      }

      function quickSearch(code) { document.getElementById('lcCodeInput').value = code; searchLcCode(); }
      function clearHistory() { queryHistory = []; localStorage.removeItem('lcscHistory'); renderHistory(); }

      function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function showToast(msg, type) {
        const toast = document.createElement('div');
        toast.className = `alert alert-${type} position-fixed top-0 end-0 m-3`;
        toast.style.zIndex = '9999';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
      }
    </script>
  </body>
</html>
