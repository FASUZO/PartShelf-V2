<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LC查询 - PartShelf</title>
    <link href="/static/css/bootstrap.css" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">
    <script src="/static/js/bootstrap.bundle.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
      body { background: #f0f2f5; }
      .lcsc-layout { display: grid; grid-template-columns: 1fr 350px; gap: 1rem; margin-top: 70px; }
      @media (max-width: 992px) { .lcsc-layout { grid-template-columns: 1fr; } }
      .search-strip { background: #fff; border-bottom: 1px solid #d0d7de; padding: 1rem 0; position: sticky; top: 56px; z-index: 100; }
      .search-strip .container { display: flex; align-items: center; gap: 1rem; }
      .search-strip input { flex: 1; }
      .cookie-badge { white-space: nowrap; }
      .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
      @media (max-width: 576px) { .info-grid { grid-template-columns: 1fr; } }
      .info-item { background: #f8f9fa; border-radius: 6px; padding: 0.6rem 0.8rem; }
      .info-label { font-size: 0.75rem; color: #666; margin-bottom: 0.2rem; }
      .info-value { font-weight: 600; font-size: 0.9rem; }
      .param-card { max-height: 400px; overflow-y: auto; }
      .param-row { display: flex; padding: 0.4rem 0; border-bottom: 1px solid #f0f0f0; font-size: 0.85rem; }
      .param-row:last-child { border-bottom: none; }
      .param-key { color: #666; min-width: 100px; flex-shrink: 0; }
      .param-val { font-weight: 500; word-break: break-all; }
      .stock-badge { padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
      .stock-now { background: #d4edda; color: #155724; }
      .stock-future { background: #fff3cd; color: #856404; }
      .stock-none { background: #f8d7da; color: #721c24; }
      .action-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .action-bar .btn { flex: 1; min-width: 120px; }
      .history-item { padding: 0.6rem 0.75rem; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
      .history-item:hover { background: #f6f8fa; }
      .history-item:last-child { border-bottom: none; }
      .compare-diff { background: #fff3cd; }
      .compare-missing { background: #f8d7da; }
    </style>
  </head>
  <body>
    {% set active_page = "lcsc" %}
    {% include "_navbar.html" %}

    <!-- 搜索条 -->
    <div class="search-strip">
      <div class="container">
        <div class="input-group" style="max-width:500px;">
          <span class="input-group-text"><i class="fas fa-barcode"></i></span>
          <input type="text" class="form-control" id="lcCodeInput" placeholder="输入LC编号，如 C192666" autofocus>
          <button class="btn btn-primary" type="button" id="searchBtn" onclick="searchLcCode()">
            <i class="fas fa-search"></i> 查询
          </button>
        </div>
        <div id="cookieStatusBadge" class="badge bg-secondary cookie-badge" style="cursor:pointer;" onclick="showCookieModal()">
          <i class="fas fa-cookie-bite me-1"></i> 检查中...
        </div>
        <button class="btn btn-sm btn-outline-secondary" onclick="debugScreenshot()" title="调试截图">
          <i class="fas fa-camera"></i> 调试
        </button>
      </div>
    </div>

    <!-- 调试截图模态框 -->
    <div class="modal fade" id="debugScreenshotModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header bg-dark text-white">
            <h5 class="modal-title"><i class="fas fa-camera me-1"></i> 浏览器调试截图</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body text-center">
            <div id="debugScreenshotContent">
              <div class="spinner-border text-primary" role="status"></div>
              <p class="mt-2 text-muted">正在截图...</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="container lcsc-layout">
      <!-- 左侧：查询结果 -->
      <div>
        <div id="resultArea" style="display:none;">
          <!-- 基本信息卡片 -->
          <div class="card mb-3">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start mb-3">
                <div>
                  <h5 class="mb-1" id="paramModel">-</h5>
                  <div class="text-muted small">
                    <span id="paramBrand">-</span> · <span id="paramPackage">-</span> · <span id="resultLcCode">-</span>
                  </div>
                </div>
                <span id="paramStock">-</span>
              </div>
              <div class="info-grid">
                <div class="info-item">
                  <div class="info-label">LC编号</div>
                  <div class="info-value" id="paramLcCode">-</div>
                </div>
                <div class="info-item">
                  <div class="info-label">型号</div>
                  <div class="info-value" id="paramModel2">-</div>
                </div>
                <div class="info-item">
                  <div class="info-label">品牌</div>
                  <div class="info-value" id="paramBrand2">-</div>
                </div>
                <div class="info-item">
                  <div class="info-label">封装</div>
                  <div class="info-value" id="paramPackage2">-</div>
                </div>
                <div class="info-item">
                  <div class="info-label">单价</div>
                  <div class="info-value" id="paramPrice">-</div>
                </div>
                <div class="info-item">
                  <div class="info-label">库存</div>
                  <div class="info-value" id="paramQuantity">-</div>
                </div>
                <div class="info-item">
                  <div class="info-label">最小起订</div>
                  <div class="info-value" id="paramMoq">-</div>
                </div>
              </div>
              <!-- 描述 -->
              <div class="mt-2" id="descArea">
                <small class="text-muted" id="paramDesc">-</small>
              </div>
            </div>
          </div>

          <!-- 详细参数 -->
          <div class="card mb-3" id="paramsArea" style="display:none;">
            <div class="card-header py-2"><strong><i class="fas fa-list me-1"></i> 详细参数</strong></div>
            <div class="card-body param-card" id="paramDetails"></div>
          </div>

          <!-- 操作栏 -->
          <div class="action-bar mb-3">
            <button class="btn btn-success" onclick="stockInFromLcsc()"><i class="fas fa-arrow-down me-1"></i> 入库</button>
            <button class="btn btn-info" onclick="compareWithInventory()"><i class="fas fa-exchange-alt me-1"></i> 对比库存</button>
            <button class="btn btn-outline-primary" onclick="openLcscPage()"><i class="fas fa-external-link-alt me-1"></i> 立创</button>
            <button class="btn btn-outline-secondary" onclick="copyLcCode()"><i class="fas fa-copy me-1"></i> 复制</button>
          </div>
        </div>

        <!-- 空状态 -->
        <div id="emptyState" class="text-center text-muted py-5">
          <i class="fas fa-search fa-3x mb-3" style="opacity:0.3;"></i>
          <p>输入LC编号开始查询立创商城零件信息</p>
        </div>
      </div>

      <!-- 右侧：查询历史 -->
      <div>
        <div class="card">
          <div class="card-header py-2 d-flex justify-content-between align-items-center">
            <strong><i class="fas fa-history me-1"></i> 查询历史</strong>
            <button class="btn btn-sm btn-outline-danger" onclick="clearHistory()">清空</button>
          </div>
          <div class="card-body p-0" id="historyList" style="max-height:600px; overflow-y:auto;">
            <p class="text-muted text-center py-3 mb-0">暂无查询记录</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Cookie管理模态框 -->
    <div class="modal fade" id="cookieModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-dark text-white">
            <h5 class="modal-title"><i class="fas fa-cookie-bite me-1"></i> Cookie管理</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="cookieInfo" class="mb-3"></div>
            <div class="alert alert-info small">
              <i class="fas fa-info-circle me-1"></i>
              Cookie用于查询立创商城数据。过期后需要重新获取。
            </div>
            <div class="d-grid gap-2">
              <button class="btn btn-primary" onclick="refreshCookie()"><i class="fas fa-sync-alt me-1"></i> 刷新Cookie</button>
              <button class="btn btn-outline-secondary" onclick="showQrLogin()"><i class="fas fa-qrcode me-1"></i> 二维码登录获取</button>
              <button class="btn btn-outline-danger" onclick="clearCookies()"><i class="fas fa-trash me-1"></i> 清除Cookie重新登录</button>
            </div>
            <div id="qrArea" class="mt-3 text-center" style="display:none;">
              <div id="qrImage"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 入库确认模态框 -->
    <div class="modal fade" id="stockInModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title"><i class="fas fa-arrow-down me-1"></i> 确认入库</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">零件信息</label>
              <div class="form-control-plaintext fw-bold" id="stockInPartInfo">-</div>
            </div>
            <div class="mb-3">
              <label for="stockInQuantity" class="form-label">入库数量 *</label>
              <input type="number" class="form-control" id="stockInQuantity" min="1" value="1" required>
            </div>
            <div class="mb-3">
              <label for="stockInRemark" class="form-label">备注</label>
              <input type="text" class="form-control" id="stockInRemark" value="LC查询入库">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="button" class="btn btn-success" onclick="confirmStockIn()">确认入库</button>
          </div>
        </div>
      </div>
    </div>

    <!-- LCSC对比弹窗 -->
    <div class="modal fade" id="lcscCompareModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-fullscreen-sm-down">
        <div class="modal-content">
          <div class="modal-header bg-info text-white">
            <h5 class="modal-title"><i class="fas fa-exchange-alt me-1"></i> LCSC对比</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="关闭"></button>
          </div>
          <div class="modal-body" id="lcscCompareBody">
            <p class="text-muted">正在加载对比数据...</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      let currentLcData = null;
      let queryHistory = JSON.parse(localStorage.getItem('lcscHistory') || '[]');

      checkCookieStatus();
      renderHistory();

      document.getElementById('lcCodeInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') searchLcCode();
      });

      async function checkCookieStatus() {
        const badge = document.getElementById('cookieStatusBadge');
        try {
          // 先检查文件是否存在
          const resp = await fetch('/api/lcsc/cookies');
          const data = await resp.json();
          if (!data.exists || data.count === 0) {
            badge.className = 'badge bg-secondary cookie-badge';
            badge.innerHTML = '<i class="fas fa-cookie-bite me-1"></i> 无Cookie';
            return;
          }

          // 验证 Cookie 是否有效
          badge.className = 'badge bg-info cookie-badge';
          badge.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> 验证中...';
          const valResp = await fetch('/api/lcsc/cookies/validate');
          const valData = await valResp.json();
          if (valData.valid) {
            badge.className = 'badge bg-success cookie-badge';
            badge.innerHTML = '<i class="fas fa-cookie-bite me-1"></i> Cookie有效';
          } else {
            badge.className = 'badge bg-warning text-dark cookie-badge';
            badge.innerHTML = '<i class="fas fa-exclamation-triangle me-1"></i> Cookie已过期';
          }
        } catch (e) {
          badge.className = 'badge bg-danger cookie-badge';
          badge.innerHTML = '<i class="fas fa-times-circle me-1"></i> 检查失败';
        }
      }

      function showCookieModal() {
        checkCookieStatus();
        new bootstrap.Modal(document.getElementById('cookieModal')).show();
      }

      async function refreshCookie() {
        const info = document.getElementById('cookieInfo');
        info.innerHTML = '<div class="alert alert-info"><i class="fas fa-spinner fa-spin me-1"></i> 正在刷新Cookie...</div>';
        try {
          const resp = await fetch('/api/lcsc/cookies/refresh', { method: 'POST' });
          const data = await resp.json();
          if (data.success) {
            info.innerHTML = '<div class="alert alert-success"><i class="fas fa-check me-1"></i> Cookie刷新成功</div>';
            checkCookieStatus();
          } else {
            info.innerHTML = `<div class="alert alert-danger"><i class="fas fa-times me-1"></i> ${data.message || '刷新失败'}</div>`;
          }
        } catch (e) {
          info.innerHTML = `<div class="alert alert-danger"><i class="fas fa-times me-1"></i> ${e.message}</div>`;
        }
      }

      async function clearCookies() {
        if (!confirm('确定要清除Cookie吗？清除后需要重新扫码登录。')) return;
        try {
          const resp = await fetch('/api/lcsc/cookies/clear', { method: 'POST' });
          const data = await resp.json();
          if (data.success) {
            showToast('Cookie已清除，请重新扫码登录', 'success');
            checkCookieStatus();
          } else {
            showToast('清除失败: ' + (data.message || ''), 'danger');
          }
        } catch (e) {
          showToast('清除失败: ' + e.message, 'danger');
        }
      }

      async function showQrLogin() {
        const qrArea = document.getElementById('qrArea');
        const qrImage = document.getElementById('qrImage');
        qrArea.style.display = 'block';
        qrImage.innerHTML = '<div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">正在获取登录二维码...</p>';
        try {
          const resp = await fetch('/api/lcsc/cookies/qrcode', { method: 'POST' });
          const data = await resp.json();
          if (data.success && data.qrcode_base64) {
            qrImage.innerHTML = `<img src="data:image/png;base64,${data.qrcode_base64}" alt="登录二维码" style="max-width:250px; border:1px solid #ddd; padding:10px; border-radius:8px;"><p class="mt-2 small text-muted">请使用立创商城APP扫描二维码登录</p>`;
            pollLoginStatus();
          } else if (data.logged_in) {
            qrImage.innerHTML = '<div class="alert alert-success"><i class="fas fa-check-circle me-1"></i> 已登录，无需扫码</div>';
          } else {
            qrImage.innerHTML = `<p class="text-danger">${data.message || '获取二维码失败'}</p>`;
          }
        } catch (e) {
          qrImage.innerHTML = `<p class="text-danger">${e.message}</p>`;
        }
      }

      async function pollLoginStatus() {
        for (let i = 0; i < 60; i++) {
          await new Promise(r => setTimeout(r, 2000));
          try {
            const resp = await fetch('/api/lcsc/cookies/status');
            const data = await resp.json();
            if (data.logged_in) {
              document.getElementById('qrImage').innerHTML = '<div class="alert alert-success"><i class="fas fa-check-circle me-1"></i> 登录成功！Cookie已更新</div>';
              checkCookieStatus();
              return;
            }
          } catch (e) {}
        }
        document.getElementById('qrImage').innerHTML = '<div class="alert alert-warning"><i class="fas fa-clock me-1"></i> 二维码已过期，请重新获取</div>';
      }

      async function searchLcCode() {
        const input = document.getElementById('lcCodeInput');
        let lcCode = input.value.trim().toUpperCase();
        if (!lcCode) { showToast('请输入LC编号', 'warning'); input.focus(); return; }
        if (/^\d+$/.test(lcCode)) { lcCode = 'C' + lcCode; input.value = lcCode; }
        if (!/^C\d+$/.test(lcCode)) { showToast('LC编号格式错误，应为C+数字', 'danger'); return; }

        const btn = document.getElementById('searchBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> 查询中...';

        // 清除上一次查询结果，显示加载状态
        document.getElementById('resultArea').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('emptyState').innerHTML = '<div class="spinner-border text-primary mb-3" role="status"></div><p class="text-muted">正在加载中，请勿再次点击...</p>';

        try {
          const resp = await fetch(`/api/lcsc/query/${lcCode}`);
          if (!resp.ok) { const err = await resp.json().catch(() => ({})); throw new Error(err.detail || '查询失败'); }
          const data = await resp.json();
          currentLcData = data;
          displayResult(data);
          addToHistory(lcCode, data);
          document.getElementById('emptyState').style.display = 'none';
        } catch (e) {
          showToast('查询失败: ' + e.message, 'danger');
          document.getElementById('resultArea').style.display = 'none';
          document.getElementById('emptyState').style.display = 'block';
          document.getElementById('emptyState').innerHTML = '<i class="fas fa-exclamation-triangle fa-3x mb-3 text-warning" style="opacity:0.5;"></i><p class="text-danger">查询失败: ' + e.message + '</p>';
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-search"></i> 查询';
          // 恢复空状态默认内容
          if (document.getElementById('emptyState').style.display !== 'none') {
            setTimeout(() => {
              document.getElementById('emptyState').innerHTML = '<i class="fas fa-search fa-3x mb-3" style="opacity:0.3;"></i><p>输入LC编号开始查询立创商城零件信息</p>';
            }, 3000);
          }
        }
      }

      function displayResult(data) {
        document.getElementById('resultArea').style.display = 'block';
        document.getElementById('resultLcCode').textContent = data.lcCode || '-';
        document.getElementById('paramLcCode').textContent = data.lcCode || '-';
        document.getElementById('paramModel').textContent = data.productModel || data.productName || '-';
        document.getElementById('paramBrand').textContent = data.brand || '-';
        document.getElementById('paramPackage').textContent = data.pack || data.package || '-';
        document.getElementById('paramPrice').textContent = data.price ? `¥${data.price}` : '-';
        document.getElementById('paramQuantity').textContent = data.stock ?? '-';
        document.getElementById('paramMoq').textContent = data.moq ?? '-';
        
        // 更新详细信息区域
        document.getElementById('paramModel2').textContent = data.productModel || data.productName || '-';
        document.getElementById('paramBrand2').textContent = data.brand || '-';
        document.getElementById('paramPackage2').textContent = data.pack || data.package || '-';

        const stockEl = document.getElementById('paramStock');
        if (data.stockStatus === 'now') {
          stockEl.innerHTML = '<span class="stock-badge stock-now">现货</span>';
        } else if (data.stockStatus === 'future') {
          stockEl.innerHTML = '<span class="stock-badge stock-future">期货</span>';
        } else {
          stockEl.innerHTML = '<span class="stock-badge stock-none">未知</span>';
        }

        document.getElementById('paramDesc').textContent = data.description || '-';

        const params = parseParams(data.params) || parseRemarkPrefix(data.remarkPrefix);
        if (params && Object.keys(params).length > 0) {
          document.getElementById('paramsArea').style.display = 'block';
          let html = '';
          for (const [key, val] of Object.entries(params)) {
            html += `<div class="param-row"><span class="param-key">${escapeHtml(key)}</span><span class="param-val">${escapeHtml(String(val))}</span></div>`;
          }
          document.getElementById('paramDetails').innerHTML = html;
        } else {
          document.getElementById('paramsArea').style.display = 'none';
        }
      }

      function parseParams(params) {
        if (!params) return null;
        if (typeof params === 'object' && !Array.isArray(params)) return normalizeOtherParams(params);
        if (typeof params === 'string') {
          try { const p = JSON.parse(params); if (typeof p === 'object' && !Array.isArray(p)) return normalizeOtherParams(p); } catch (e) {}
          const result = {};
          const lines = params.split(';');
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed) continue;
            const match = trimmed.match(/^(.+?)[：:]\s*(.+)$/);
            if (match) { const k = match[1].trim(), v = match[2].trim(); if (k && v && v !== '-') result[k] = v; }
          }
          return Object.keys(result).length > 0 ? result : null;
        }
        return null;
      }

      function normalizeOtherParams(other) {
        if (!other || typeof other !== 'object') return null;
        if (other.fields && other.values) {
          const r = {};
          for (const f of other.fields) { if (other.values[f] !== undefined && other.values[f] !== '') r[f] = other.values[f]; }
          return Object.keys(r).length > 0 ? r : null;
        }
        const r = {};
        for (const [k, v] of Object.entries(other)) { if (v !== undefined && v !== '' && v !== null) r[k] = String(v); }
        return Object.keys(r).length > 0 ? r : null;
      }

      function parseRemarkPrefix(rp) {
        if (!rp || typeof rp !== 'string') return null;
        const params = {};
        const lines = rp.split(/<\/br>|\n/);
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;
          const match = trimmed.match(/^(.+?)[：:]\s*(.+)$/);
          if (match) { const k = match[1].trim(), v = match[2].trim(); if (k && v && v !== '-') params[k] = v; }
        }
        return Object.keys(params).length > 0 ? params : null;
      }

      // 对比库存
      async function compareWithInventory() {
        if (!currentLcData) return;
        const lcCode = currentLcData.lcCode;
        if (!lcCode) { showToast('无LC编号可对比', 'warning'); return; }
        try {
          const resp = await fetch('/api/inventory/advanced_search', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ search_key: lcCode, page: 1, page_size: 10 })
          });
          const data = await resp.json();
          const parts = data.data || [];
          if (parts.length === 0) { showToast('库存中未找到匹配零件', 'info'); return; }
          displayCompareResult(parts[0]);
        } catch (e) { showToast('查询库存失败: ' + e.message, 'danger'); }
      }

      function displayCompareResult(part) {
        const body = document.getElementById('lcscCompareBody');
        if (!body) return;

        const lcscParams = parseParams(currentLcData.params) || parseRemarkPrefix(currentLcData.remarkPrefix) || {};
        const partParams = parseParams(part.other) || {};

        let html = '<div class="table-responsive"><table class="table table-sm table-bordered mb-0" style="font-size:0.85rem;">';
        html += '<thead class="table-light"><tr><th style="width:25%">字段</th><th style="width:37%">LCSC数据</th><th style="width:37%">库存数据</th></tr></thead><tbody>';
        const fields = [
          ['型号', currentLcData.productModel, part.name],
          ['品牌', currentLcData.brand, part.manufacturer],
          ['封装', currentLcData.pack || currentLcData.package, part.package],
          ['LC编号', currentLcData.lcCode, part.lc_number || '-'],
        ];
        for (const [label, lc, inv] of fields) {
          const cls = lc !== inv ? ' class="table-warning"' : '';
          html += `<tr${cls}><td>${label}</td><td>${escapeHtml(lc||'-')}</td><td>${escapeHtml(inv||'-')}</td></tr>`;
        }
        html += '</tbody></table></div>';

        const allKeys = new Set([...Object.keys(lcscParams), ...Object.keys(partParams)]);
        if (allKeys.size > 0) {
          html += '<h6 class="mt-3 mb-2 text-muted">参数对比</h6>';
          html += '<div class="table-responsive"><table class="table table-sm table-bordered mb-0" style="font-size:0.85rem;"><thead class="table-light"><tr><th>参数</th><th>LCSC</th><th>库存</th></tr></thead><tbody>';
          for (const key of allKeys) {
            const lcVal = lcscParams[key] || '-';
            const invVal = partParams[key] || '-';
            const cls = (!partParams[key] && lcscParams[key]) ? ' class="table-warning"' : (lcVal !== invVal ? ' class="table-danger"' : '');
            html += `<tr${cls}><td>${escapeHtml(key)}</td><td>${escapeHtml(String(lcVal))}</td><td>${escapeHtml(String(invVal))}</td></tr>`;
          }
          html += '</tbody></table></div>';
        }

        html += `<div class="mt-3 d-flex gap-2"><button class="btn btn-warning flex-fill" onclick="updatePartFromLcsc(${part.id})"><i class="fas fa-sync me-1"></i> 用LCSC数据更新库存</button></div>`;
        body.innerHTML = html;

        // 显示弹窗
        new bootstrap.Modal(document.getElementById('lcscCompareModal')).show();
      }

      async function updatePartFromLcsc(partId) {
        if (!currentLcData) return;
        if (!confirm('确定用LCSC数据更新库存零件的参数？\n\n将合并LCSC参数到库存中，相同参数名会覆盖。')) return;
        
        const lcscParams = parseParams(currentLcData.params) || parseRemarkPrefix(currentLcData.remarkPrefix) || {};
        let existingOther = {};
        try {
          const resp = await fetch(`/api/inventory/get_part_by_id?part_id=${partId}`);
          const partData = await resp.json();
          if (partData.other) existingOther = JSON.parse(partData.other) || {};
        } catch (e) {}
        const existingValues = normalizeOtherParams(existingOther) || {};
        const mergedValues = { ...existingValues, ...lcscParams };
        const formData = new FormData();
        formData.append('part_id', partId);
        formData.append('name', currentLcData.productModel || '');
        formData.append('manufacturer', currentLcData.brand || '');
        formData.append('package', (currentLcData.pack || currentLcData.package) || '');
        formData.append('lc_number', currentLcData.lcCode || '');
        formData.append('description', currentLcData.description || '');
        if (Object.keys(mergedValues).length > 0) {
          formData.append('other', JSON.stringify({ fields: Object.keys(mergedValues), values: mergedValues, units: {} }));
        }
        
        // 显示加载状态
        const btn = event.target;
        const origText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> 更新中...';
        
        try {
          const resp = await fetch('/api/inventory/update_part', { method: 'POST', body: formData });
          if (!resp.ok) throw new Error('更新失败');
          
          // 关闭对比弹窗
          const modal = bootstrap.Modal.getInstance(document.getElementById('lcscCompareModal'));
          if (modal) modal.hide();
          
          showToast('零件参数已更新！', 'success');
        } catch (e) { 
          showToast('更新失败: ' + e.message, 'danger'); 
        } finally {
          btn.disabled = false;
          btn.innerHTML = origText;
        }
      }

      // 入库
      function stockInFromLcsc() {
        if (!currentLcData) return;
        document.getElementById('stockInPartInfo').textContent = `${currentLcData.productModel || '-'} (${currentLcData.brand || '-'})`;
        document.getElementById('stockInQuantity').value = 1;
        new bootstrap.Modal(document.getElementById('stockInModal')).show();
      }

      async function confirmStockIn() {
        const quantity = parseInt(document.getElementById('stockInQuantity').value);
        if (!quantity || quantity < 1) { showToast('请输入有效数量', 'warning'); return; }
        
        const lcscParams = parseParams(currentLcData.params) || parseRemarkPrefix(currentLcData.remarkPrefix) || {};
        const formData = new FormData();
        formData.append('name', currentLcData.productModel || '');
        formData.append('manufacturer', currentLcData.brand || '');
        formData.append('package', (currentLcData.pack || currentLcData.package) || '');
        formData.append('quantity', quantity);
        formData.append('lc_number', currentLcData.lcCode || '');
        formData.append('description', currentLcData.description || '');
        formData.append('part_type', '');
        if (Object.keys(lcscParams).length > 0) {
          formData.append('other', JSON.stringify({ fields: Object.keys(lcscParams), values: lcscParams, units: {} }));
        }
        
        // 显示加载状态
        const btn = document.querySelector('#stockInModal .btn-success');
        const origText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> 入库中...';
        
        try {
          const resp = await fetch('/api/inventory/add_part_to_inventory', { method: 'POST', body: formData });
          if (!resp.ok) { const err = await resp.json().catch(() => ({})); throw new Error(err.detail || '入库失败'); }
          bootstrap.Modal.getInstance(document.getElementById('stockInModal')).hide();
          showToast('入库成功！', 'success');
        } catch (e) { 
          showToast('入库失败: ' + e.message, 'danger'); 
        } finally {
          btn.disabled = false;
          btn.innerHTML = origText;
        }
      }

      function openLcscPage() {
        if (currentLcData?.lcCode) window.open(`https://www.szlcsc.com/product/details_${currentLcData.lcCode}.html`, '_blank');
      }

      function copyLcCode() {
        if (currentLcData?.lcCode) {
          navigator.clipboard.writeText(currentLcData.lcCode);
          showToast('已复制: ' + currentLcData.lcCode, 'success');
        }
      }

      function addToHistory(lcCode, data) {
        queryHistory = queryHistory.filter(h => h.code !== lcCode);
        queryHistory.unshift({ code: lcCode, model: data.productModel || data.productName, brand: data.brand, time: Date.now() });
        if (queryHistory.length > 30) queryHistory.pop();
        localStorage.setItem('lcscHistory', JSON.stringify(queryHistory));
        renderHistory();
      }

      function renderHistory() {
        const el = document.getElementById('historyList');
        if (queryHistory.length === 0) {
          el.innerHTML = '<p class="text-muted text-center py-3 mb-0">暂无查询记录</p>';
          return;
        }
        el.innerHTML = queryHistory.map(h => `
          <div class="history-item" onclick="quickSearch('${h.code}')">
            <div>
              <div><strong>${escapeHtml(h.code)}</strong></div>
              <small class="text-muted">${escapeHtml(h.model || '-')} · ${escapeHtml(h.brand || '-')}</small>
            </div>
            <small class="text-muted">${new Date(h.time).toLocaleTimeString()}</small>
          </div>
        `).join('');
      }

      function quickSearch(code) { document.getElementById('lcCodeInput').value = code; searchLcCode(); }
      function clearHistory() { queryHistory = []; localStorage.removeItem('lcscHistory'); renderHistory(); }

      function escapeHtml(str) { if (!str) return ''; const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
      function showToast(msg, type) {
        const t = document.createElement('div');
        t.className = `alert alert-${type} position-fixed top-0 end-0 m-3`;
        t.style.zIndex = '9999';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
      }

      // 调试截图
      async function debugScreenshot() {
        new bootstrap.Modal(document.getElementById('debugScreenshotModal')).show();
        const content = document.getElementById('debugScreenshotContent');
        content.innerHTML = '<div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">正在截图...</p>';

        try {
          const resp = await fetch('/api/lcsc/debug/screenshot');
          const data = await resp.json();
          if (data.success) {
            content.innerHTML = `
              <p class="text-muted mb-2">URL: ${escapeHtml(data.url || '-')}</p>
              <p class="text-muted mb-2">Title: ${escapeHtml(data.title || '-')}</p>
              <img src="data:image/png;base64,${data.screenshot}" class="img-fluid border rounded" style="max-height:500px;">
            `;
          } else {
            content.innerHTML = `<p class="text-danger">${escapeHtml(data.error || '截图失败')}</p>`;
          }
        } catch (e) {
          content.innerHTML = `<p class="text-danger">${escapeHtml(e.message)}</p>`;
        }
      }
    </script>
  </body>
</html>
